apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
  namespace: nginx-test
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress-system
      sectionName: https-nginx
  hostnames:
    - nginx.ahaouari.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
