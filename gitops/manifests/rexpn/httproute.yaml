apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rexpn-route
  namespace: rexpn
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress-system
      sectionName: https-rexpn
  hostnames:
    - rexpn.ahaouari.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rexpn-svc
          port: 80
