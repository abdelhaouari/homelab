apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-routing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/abdelhaouari/homelab.git"
    path: gitops/manifests/argocd-routing
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ingress-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
