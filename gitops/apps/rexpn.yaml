apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rexpn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/abdelhaouari/homelab.git"
    path: gitops/manifests/rexpn
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: rexpn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
